<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xamanek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --ink:#0A0F1A; --ink-dim:#6A6E76;
  --gold:#C48A12; --gold-hi:#E9B53C; --gold-deep:#7A560A;
  --sclera:#FFFFFF; --pupil:#0A0F1A; --glow:.20;
  --star-rgb:10,15,26; --star-a:0; --dust-rgb:196,138,18;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#04070D; --ink:#E9E2D0; --ink-dim:#8C877A;
    --gold:#E7AE2E; --gold-hi:#FFE08A; --gold-deep:#9A6E12;
    --sclera:#EFE8D6; --pupil:#04070D; --glow:.34;
    --star-rgb:233,226,208; --star-a:1; --dust-rgb:255,210,110;
  }
}
:root[data-theme="dark"]{
  --bg:#04070D; --ink:#E9E2D0; --ink-dim:#8C877A;
  --gold:#E7AE2E; --gold-hi:#FFE08A; --gold-deep:#9A6E12;
  --sclera:#EFE8D6; --pupil:#04070D; --glow:.34;
  --star-rgb:233,226,208; --star-a:1; --dust-rgb:255,210,110;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);transition:background .5s ease,color .5s ease}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
main{position:relative;z-index:1;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,24px);padding:64px 16px 32px;overflow:hidden}
#mark{display:block;width:min(94vw, calc(66svh * .88), 680px);height:auto;overflow:visible;touch-action:manipulation}
.wm{position:relative;margin:0;font-family:'Cinzel','Trajan Pro',Georgia,serif;font-weight:500;font-size:clamp(30px,7.2vw,68px);letter-spacing:.38em;margin-right:-.38em;line-height:1;color:var(--gold)}
.wm span{display:inline-block;opacity:0;transform:translateY(8px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(3.3s + var(--i) * 80ms)}
.wm::after{content:attr(data-text);position:absolute;inset:0;color:transparent;background:linear-gradient(105deg,transparent 0%,transparent 42%,var(--gold-hi) 50%,transparent 58%,transparent 100%);background-size:300% 100%;background-position:150% 0;-webkit-background-clip:text;background-clip:text;animation:sheen 6s ease-in-out 5s infinite;pointer-events:none}
.tag{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(18px,2.4vw,23px);color:var(--ink-dim);line-height:1.4}
#theme{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--gold-deep);background:transparent;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;cursor:pointer}
#theme:hover{border-color:var(--gold)}
#theme:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* colores del símbolo */
.s-ink{stroke:var(--ink)} .s-dim{stroke:var(--ink-dim)} .s-gold{stroke:var(--gold)} .s-goldhi{stroke:var(--gold-hi)} .s-golddeep{stroke:var(--gold-deep)} .s-pupil{stroke:var(--pupil)}
.f-bg{fill:var(--bg)} .f-gold{fill:var(--gold)} .f-goldhi{fill:var(--gold-hi)} .f-sclera{fill:var(--sclera)} .f-pupil{fill:var(--pupil)} .f-hl{fill:#FFFFFF;opacity:.92}
.g0{stop-color:var(--gold-hi);stop-opacity:var(--glow)} .g1{stop-color:var(--gold);stop-opacity:0}
.c0{stop-color:var(--gold-hi)} .c1{stop-color:var(--gold)} .c2{stop-color:var(--gold-deep)}

/* entrada */
.draw{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw var(--t,1.1s) cubic-bezier(.65,0,.25,1) forwards;animation-delay:var(--d,0s)}
.fade{opacity:0;animation:fadein .9s ease forwards;animation-delay:var(--d,0s)}
.cap{opacity:0;transform:translateY(-28px);animation:drop 1.2s cubic-bezier(.2,.75,.2,1) 1.6s forwards}
.rays{opacity:0;transform-origin:300px 243px;transform:scale(.85);animation:rayin 1.3s ease 2.2s forwards}
.glow{opacity:0;animation:fadein 1.6s ease 2.4s forwards}

/* animaciones continuas */
.spin{transform-origin:300px 243px;animation:spin 80s linear infinite}
.spin-rev{transform-origin:300px 243px;animation:spin 140s linear infinite reverse}
.spin-slow{transform-origin:300px 243px;animation:spin 220s linear infinite reverse}
.breathe{transform-origin:300px 243px;animation:breathe 5s ease-in-out 4s infinite}
.float{animation:float 6s ease-in-out 2.8s infinite}
.twinkle{transform-origin:300px 58px;animation:twinkle 3.2s ease-in-out 3s infinite}

/* ciclo de 10 s: serpiente de luz baja, la energía sube por la escalinata y estalla en la piedra angular */
.serp{opacity:.08;animation:serp 10s linear infinite;animation-delay:calc(6s + var(--j) * 180ms)}
.head-glow{opacity:0;animation:headglow 10s linear 7.3s infinite}
.step{animation:stepglow 10s linear infinite;animation-delay:calc(9s + var(--k) * 35ms)}
.capflash{opacity:0;animation:flash 10s linear 10.2s infinite}
.burst{opacity:0;transform-origin:300px 243px;animation:burst 10s ease-out 10.2s infinite}
.ripple{transform-origin:300px 243px;animation:ripple .95s cubic-bezier(.2,.7,.2,1) forwards}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes drop{to{opacity:1;transform:none}}
@keyframes rayin{to{opacity:1;transform:none}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.94);opacity:.75}50%{transform:scale(1.07);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0deg);opacity:.85}50%{transform:scale(1.35) rotate(45deg);opacity:1}}
@keyframes sheen{0%{background-position:150% 0}40%,100%{background-position:-50% 0}}
@keyframes serp{0%{opacity:.08}3%{opacity:1}24%{opacity:1}32%{opacity:.08}100%{opacity:.08}}
@keyframes headglow{0%{opacity:0}3%{opacity:1}22%{opacity:1}30%{opacity:0}100%{opacity:0}}
@keyframes stepglow{0%{stroke:var(--ink-dim);stroke-width:.8}1.5%{stroke:var(--gold-hi);stroke-width:2}7%{stroke:var(--ink-dim);stroke-width:.8}100%{stroke:var(--ink-dim);stroke-width:.8}}
@keyframes flash{0%{opacity:0}2%{opacity:1}12%{opacity:0}100%{opacity:0}}
@keyframes burst{0%{opacity:0;transform:scale(.7)}3%{opacity:1}16%{opacity:0;transform:scale(1.35)}100%{opacity:0;transform:scale(1.35)}}
@keyframes ripple{from{transform:scale(.15);opacity:.9}to{transform:scale(1);opacity:0}}

@media (prefers-reduced-motion: reduce){
  .draw,.fade,.cap,.rays,.glow,.wm span{animation:none;opacity:1;transform:none;stroke-dashoffset:0}
  .spin,.spin-rev,.spin-slow,.breathe,.float,.twinkle,.serp,.head-glow,.step,.capflash,.burst,.wm::after{animation:none}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<button id="theme" type="button">Ver en blanco</button>
<main>
  <svg id="mark" viewBox="0 -40 600 680" role="img" aria-label="Logo de Xamanek: pirámide maya con una piedra angular dorada y un ojo realista que mira al visitante"></svg>
  <h1 class="wm" data-text="XAMANEK" aria-label="Xamanek"><span aria-hidden="true" style="--i:0">X</span><span aria-hidden="true" style="--i:1">A</span><span aria-hidden="true" style="--i:2">M</span><span aria-hidden="true" style="--i:3">A</span><span aria-hidden="true" style="--i:4">N</span><span aria-hidden="true" style="--i:5">E</span><span aria-hidden="true" style="--i:6">K</span></h1>
  <p class="tag fade" style="--d:4.1s">Your north star in technology</p>
</main>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('mark');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CX = 300, CY = 243;
  const rad = d => d * Math.PI / 180;
  const pol = (r, a) => [CX + r * Math.sin(rad(a)), CY - r * Math.cos(rad(a))];

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  // ---------- definiciones ----------
  const defs = el('defs', {});
  const rg = el('radialGradient', { id: 'glowGrad' }, defs);
  el('stop', { offset: '0', class: 'g0' }, rg);
  el('stop', { offset: '1', class: 'g1' }, rg);
  const cg = el('linearGradient', { id: 'capGrad', x1: '0', y1: '0', x2: '1', y2: '1' }, defs);
  el('stop', { offset: '0', class: 'c0' }, cg);
  el('stop', { offset: '.5', class: 'c1' }, cg);
  el('stop', { offset: '1', class: 'c2' }, cg);
  const f6 = el('filter', { id: 'blur6', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
  el('feGaussianBlur', { stdDeviation: '6' }, f6);
  const f3 = el('filter', { id: 'blur3', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
  el('feGaussianBlur', { stdDeviation: '3' }, f3);
  const capClip = el('clipPath', { id: 'capClip' }, defs);
  el('path', { d: 'M300 90 L430 320 L170 320 Z' }, capClip);
  const clip = el('clipPath', { id: 'aperture' }, defs);
  const apPath = el('path', { d: '' }, clip);

  // ---------- resplandor que respira + estallido ----------
  const glowWrap = el('g', { class: 'glow' });
  el('circle', { id: 'glow', cx: CX, cy: CY, r: 190, fill: 'url(#glowGrad)', class: 'breathe' }, glowWrap);
  el('circle', { id: 'burst', cx: CX, cy: CY, r: 230, fill: 'url(#glowGrad)', class: 'burst' });

  // ---------- rayos (dos capas girando en sentidos opuestos) ----------
  const raysPar = el('g', { id: 'rays-parallax' });
  const raysIn = el('g', { class: 'rays' }, raysPar);
  const spinA = el('g', { id: 'rays-main', class: 'spin', 'stroke-linecap': 'round' }, raysIn);
  for (let a = 0; a < 360; a += 4) {
    const long = (a / 4) % 3 === 0;
    const r2 = long ? 272 : 222 + (((a * 7919) % 23) + 23) % 23;
    const [x1, y1] = pol(200, a), [x2, y2] = pol(r2, a);
    el('line', { x1, y1, x2, y2, class: long ? 's-goldhi' : 's-gold', 'stroke-width': long ? 1.6 : 0.9, opacity: long ? 1 : 0.6 }, spinA);
  }
  const spinB = el('g', { id: 'rays-fine', class: 'spin-rev', 'stroke-linecap': 'round' }, raysIn);
  for (let a = 1.5; a < 360; a += 3) {
    const r2 = 206 + (((a * 104729) % 31) + 31) % 31;
    const [x1, y1] = pol(194, a), [x2, y2] = pol(r2, a);
    el('line', { x1, y1, x2, y2, class: 's-gold', 'stroke-width': 0.5, opacity: 0.35 }, spinB);
  }

  // ---------- halo con rumbos (gira lento) y Estrella Polar fija ----------
  const haloPar = el('g', { id: 'halo-parallax' });
  el('circle', { cx: CX, cy: CY, r: 185, fill: 'none', class: 's-gold draw', pathLength: 1, style: '--d:.1s;--t:2.2s', 'stroke-width': 1.2, opacity: .85 }, haloPar);
  el('circle', { cx: CX, cy: CY, r: 162, fill: 'none', class: 's-golddeep draw', pathLength: 1, style: '--d:.5s;--t:2.2s', 'stroke-width': .6 }, haloPar);
  const ticksFade = el('g', { class: 'fade', style: '--d:1.4s' }, haloPar);
  const ticks = el('g', { id: 'halo-ticks', class: 'spin-slow' }, ticksFade);
  for (let a = 5; a < 360; a += 5) {
    const len = a % 90 === 0 ? 16 : (a % 15 === 0 ? 10 : 5);
    const [x1, y1] = pol(185, a), [x2, y2] = pol(185 - len, a);
    el('line', { x1, y1, x2, y2, class: a % 15 === 0 ? 's-gold' : 's-golddeep', 'stroke-width': a % 90 === 0 ? 1.4 : 0.7 }, ticks);
  }
  const starWrap = el('g', { class: 'fade', style: '--d:2.5s' }, haloPar);
  const star = 'M300 42 L304 54 L316 58 L304 62 L300 74 L296 62 L284 58 L296 54 Z';
  el('path', { d: star, class: 'f-goldhi twinkle', filter: 'url(#blur6)', opacity: .9 }, starWrap);
  el('path', { id: 'north-star', d: star, class: 'f-goldhi twinkle' }, starWrap);

  // ---------- pirámide escalonada (9 cuerpos) ----------
  const pyr = el('g', { id: 'pyramid', 'stroke-linejoin': 'round' });
  const tiers = [];
  for (let i = 0; i < 9; i++) {
    const yb = 620 - 30 * i, yt = yb - 30, hb = 240 - i * 120 / 9, ht = hb - 5;
    tiers.push({ yb, yt });
    el('path', { d: `M${CX - hb} ${yb} L${CX - ht} ${yt} L${CX + ht} ${yt} L${CX + hb} ${yb} Z`, class: 's-ink f-bg draw', pathLength: 1, style: `--d:${(0.15 + i * 0.11).toFixed(2)}s`, 'stroke-width': 1.5 }, pyr);
    el('line', { x1: CX - ht + 4, y1: yt + 9, x2: CX + ht - 4, y2: yt + 9, class: 's-gold draw', pathLength: 1, style: `--d:${(0.45 + i * 0.11).toFixed(2)}s`, 'stroke-width': 0.8, opacity: .8 }, pyr);
  }

  // ---------- escalinata central ----------
  const st = el('g', { id: 'stairs', class: 'fade', style: '--d:1.3s' });
  el('path', { d: 'M266 620 L274 350 L326 350 L334 620 Z', class: 's-ink f-bg', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, st);
  el('line', { x1: 273, y1: 620, x2: 280.5, y2: 350, class: 's-gold', 'stroke-width': 1.2 }, st);
  el('line', { x1: 327, y1: 620, x2: 319.5, y2: 350, class: 's-gold', 'stroke-width': 1.2 }, st);
  const steps = [];
  for (let y = 357.5; y < 620; y += 7.5) steps.push(y);
  steps.reverse().forEach((y, k) => {
    const t = (y - 350) / 270;
    el('line', { x1: 280.5 - 7.5 * t, y1: y, x2: 319.5 + 7.5 * t, y2: y, class: 's-dim step', style: `--k:${k}`, 'stroke-width': 0.8 }, st);
  });

  // ---------- serpiente de luz de Kukulkán (baja por la alfarda) ----------
  const serp = el('g', { id: 'kukulkan-light', class: 'fade', style: '--d:2s' });
  const xb = y => 334 - 8 * (620 - y) / 270;
  for (let j = 0; j < 7; j++) {
    const { yb, yt } = tiers[7 - j];
    const x = xb((yb + yt) / 2);
    el('path', { d: `M${x} ${yt + 4} L${x + 11} ${(yb + yt) / 2} L${x} ${yb - 4} Z`, class: 'f-goldhi serp', style: `--j:${j}` }, serp);
  }
  // cabezas de serpiente en la base
  const heads = el('g', { id: 'serpent-heads', class: 'fade', style: '--d:1.5s' });
  [[248, 1], [352, -1]].forEach(([x, s]) => {
    const x2 = x + 22 * s;
    el('path', { d: `M${x} 620 L${x} 606 L${x2 - 4 * s} 604 L${x2} 609 L${x2} 620 Z`, class: 's-ink f-bg', 'stroke-width': 1.3, 'stroke-linejoin': 'round' }, heads);
    el('path', { d: `M${x2} 613 L${x + 9 * s} 613 L${x + 9 * s} 616`, class: 's-gold', fill: 'none', 'stroke-width': .9 }, heads);
    el('circle', { cx: x + 14 * s, cy: 609, r: 7, class: 'f-goldhi head-glow', filter: 'url(#blur3)' }, heads);
    el('circle', { cx: x + 14 * s, cy: 609, r: 1.9, class: 'f-goldhi' }, heads);
  });

  // ---------- piedra angular dorada ----------
  const CAP = 'M300 80 L440 324 L160 324 Z';
  capClip.firstChild.setAttribute('d', CAP);
  const capPar = el('g', { id: 'capstone-parallax' });
  const cap = el('g', { id: 'capstone', class: 'cap' }, capPar);
  const fl = el('g', { class: 'float' }, cap);
  el('path', { d: CAP, class: 's-goldhi capflash', fill: 'none', 'stroke-width': 7, filter: 'url(#blur6)', 'stroke-linejoin': 'round' }, fl);
  el('path', { d: CAP, fill: 'url(#capGrad)', class: 's-goldhi', 'stroke-width': 1.6, 'stroke-linejoin': 'round' }, fl);
  const hatch = el('g', { 'clip-path': 'url(#capClip)', opacity: .32 }, fl);
  for (let y = 100; y < 324; y += 6) el('line', { x1: 150, y1: y, x2: 450, y2: y, class: 's-golddeep', 'stroke-width': .6 }, hatch);
  el('path', { d: 'M300 104 L416 314 L184 314 Z', class: 's-golddeep', fill: 'none', 'stroke-width': .9, 'stroke-linejoin': 'round' }, fl);

  // ---------- definiciones del ojo realista ----------
  let seed = 20261006;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const gStops = (id, stops, attrs) => {
    const g = el('radialGradient', Object.assign({ id }, attrs || {}), defs);
    stops.forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, g));
  };
  gStops('scleraGrad', [['0', '#FBF6EC'], ['.5', '#F1E7D6'], ['.8', '#DCC9B0'], ['1', '#A88C72']], { cx: '.5', cy: '.55', r: '.6' });
  gStops('irisGrad', [['0', '#2B1804'], ['.33', '#7A4C0E'], ['.48', '#C88E2A'], ['.62', '#E2AE45'], ['.8', '#B9822A'], ['.93', '#6A430E'], ['1', '#24160A']]);
  gStops('carGrad', [['0', '#EDB2A8'], ['1', '#B4685F']]);
  const mk = (id, sd) => { const f = el('filter', { id, x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs); el('feGaussianBlur', { stdDeviation: sd }, f); };
  mk('soft', '.45'); mk('soft1', '.9'); mk('blur4', '4'); mk('blur9', '9');
  const nf = el('filter', { id: 'irisNoise', x: '0', y: '0', width: '100%', height: '100%' }, defs);
  el('feTurbulence', { type: 'fractalNoise', baseFrequency: '.85', numOctaves: '2', seed: '7' }, nf);
  el('feColorMatrix', { type: 'matrix', values: '0 0 0 0 .16  0 0 0 0 .1  0 0 0 0 .03  1.6 0 0 0 -.55' }, nf);
  el('feComposite', { in2: 'SourceGraphic', operator: 'in' }, nf);

  // ---------- ojo ----------
  const L0 = 226, L1 = CY + 3, R0 = 374, R1 = CY - 2;
  const eye = el('g', { id: 'eye' }, fl);
  el('ellipse', { cx: CX, cy: CY, rx: 96, ry: 54, fill: '#1A0E04', opacity: .5, filter: 'url(#blur9)' }, eye);
  const creaseSh = el('path', { fill: 'none', stroke: '#1A0E04', 'stroke-width': 4, opacity: .35, filter: 'url(#blur4)' }, eye);
  const crease = el('path', { fill: 'none', class: 's-golddeep', 'stroke-width': 1.8, 'stroke-linecap': 'round' }, eye);

  const inner = el('g', { 'clip-path': 'url(#aperture)' }, eye);
  el('rect', { id: 'sclera', x: 220, y: 190, width: 160, height: 110, fill: 'url(#scleraGrad)' }, inner);
  const veins = el('g', { id: 'veins', fill: 'none', stroke: '#B8605A', 'stroke-linecap': 'round' }, inner);
  [-1, 1].forEach(side => {
    for (let v = 0; v < 4; v++) {
      let x = side < 0 ? 229 + rnd() * 6 : 371 - rnd() * 6, y = CY + (rnd() - .5) * 22;
      let d = `M${x.toFixed(1)} ${y.toFixed(1)}`;
      for (let s = 0; s < 4; s++) { x += -side * (5 + rnd() * 6); y += (rnd() - .5) * 6; d += ` L${x.toFixed(1)} ${y.toFixed(1)}`; }
      el('path', { d, 'stroke-width': (.35 + rnd() * .3).toFixed(2), opacity: .28 }, veins);
    }
  });
  el('ellipse', { id: 'caruncle', cx: 233, cy: CY + 3, rx: 8, ry: 6.5, fill: 'url(#carGrad)', filter: 'url(#soft1)' }, inner);

  const iris = el('g', { id: 'iris' }, inner);
  el('circle', { cx: CX, cy: CY, r: 34, fill: '#2A1A08', opacity: .25, filter: 'url(#blur4)' }, iris);
  el('circle', { cx: CX, cy: CY, r: 30, fill: 'url(#irisGrad)' }, iris);
  const fib = el('g', { id: 'iris-fibers', fill: 'none', 'stroke-linecap': 'round' }, iris);
  for (let i = 0; i < 190; i++) {
    const a = rnd() * Math.PI * 2, r1 = 10 + rnd() * 3, r2 = 18 + rnd() * 11.5, light = rnd() < .45;
    const ca = a + (rnd() - .5) * .14, rm = (r1 + r2) / 2;
    el('path', {
      d: `M${(CX + r1 * Math.cos(a)).toFixed(2)} ${(CY + r1 * Math.sin(a)).toFixed(2)} Q${(CX + rm * Math.cos(ca)).toFixed(2)} ${(CY + rm * Math.sin(ca)).toFixed(2)} ${(CX + r2 * Math.cos(a)).toFixed(2)} ${(CY + r2 * Math.sin(a)).toFixed(2)}`,
      stroke: light ? '#F6D58A' : '#4A2E08', 'stroke-width': (.3 + rnd() * .35).toFixed(2), opacity: (light ? .18 + rnd() * .3 : .2 + rnd() * .3).toFixed(2)
    }, fib);
  }
  el('circle', { cx: CX, cy: CY, r: 30, fill: '#FFFFFF', filter: 'url(#irisNoise)', opacity: .5, style: 'mix-blend-mode:multiply' }, iris);
  let cd = '';
  for (let i = 0; i <= 120; i++) {
    const th = i / 120 * Math.PI * 2, r = 14.5 + 1.3 * Math.sin(11 * th + 1) + .7 * Math.sin(27 * th);
    cd += (i ? ' L' : 'M') + (CX + r * Math.cos(th)).toFixed(2) + ' ' + (CY + r * Math.sin(th)).toFixed(2);
  }
  el('path', { id: 'collarette', d: cd + ' Z', fill: 'none', stroke: '#F2C96A', 'stroke-width': 1.1, opacity: .5 }, iris);
  for (let i = 0; i < 8; i++) {
    const a = rnd() * Math.PI * 2, r = 17 + rnd() * 7;
    el('ellipse', { cx: CX + r * Math.cos(a), cy: CY + r * Math.sin(a), rx: 1.6 + rnd() * 1.4, ry: .8 + rnd() * .6, fill: '#2A1805', opacity: .35, transform: `rotate(${(a * 180 / Math.PI + 90).toFixed(1)} ${(CX + r * Math.cos(a)).toFixed(2)} ${(CY + r * Math.sin(a)).toFixed(2)})` }, iris);
  }
  el('circle', { cx: CX, cy: CY, r: 29.3, fill: 'none', stroke: '#1A0F03', 'stroke-width': 3, opacity: .75, filter: 'url(#soft1)' }, iris);
  const pupil = el('circle', { id: 'pupil', cx: CX, cy: CY, r: 10.5, fill: '#060302', filter: 'url(#soft)' }, iris);
  const ruff = el('circle', { cx: CX, cy: CY, r: 11, fill: 'none', stroke: '#8A5A16', 'stroke-width': .9, opacity: .55 }, iris);

  const shU = el('path', { fill: 'none', stroke: '#1A0E04', 'stroke-width': 15, opacity: .5, filter: 'url(#blur4)' }, inner);
  const shL = el('path', { fill: 'none', stroke: '#1A0E04', 'stroke-width': 7, opacity: .22, filter: 'url(#blur4)' }, inner);
  const refl = el('g', { id: 'reflections' }, inner);
  el('rect', { x: CX - 15, y: CY - 18, width: 9, height: 6.5, rx: 2, fill: '#FFFFFF', opacity: .9, filter: 'url(#soft)', transform: `rotate(-12 ${CX - 10} ${CY - 15})` }, refl);
  el('circle', { cx: CX + 12, cy: CY + 9, r: 1.3, fill: '#FFFFFF', opacity: .55 }, refl);
  el('path', { d: `M${CX - 26} ${CY - 6} A28 28 0 0 1 ${CX - 6} ${CY - 27}`, fill: 'none', stroke: '#FFFFFF', 'stroke-width': 5, opacity: .13, filter: 'url(#soft1)' }, refl);
  const water = el('path', { fill: 'none', stroke: '#FFF6E6', 'stroke-width': .9, opacity: .4 }, inner);

  const lidUThick = el('path', { fill: 'none', class: 's-golddeep', 'stroke-width': 6, 'stroke-linecap': 'round' }, eye);
  const lidURim = el('path', { fill: 'none', class: 's-goldhi', 'stroke-width': 1.1, opacity: .8, 'stroke-linecap': 'round' }, eye);
  const lidLThick = el('path', { fill: 'none', class: 's-golddeep', 'stroke-width': 3.5, 'stroke-linecap': 'round' }, eye);
  const lidLRim = el('path', { fill: 'none', class: 's-goldhi', 'stroke-width': .8, opacity: .6, 'stroke-linecap': 'round' }, eye);
  const lashLineU = el('path', { fill: 'none', stroke: '#160C03', 'stroke-width': 1.8, 'stroke-linecap': 'round' }, eye);
  const lashLineL = el('path', { fill: 'none', stroke: '#2A1A08', 'stroke-width': .9, opacity: .7, 'stroke-linecap': 'round' }, eye);
  const lashesU = el('path', { id: 'lashes-upper', fill: 'none', stroke: '#140A02', 'stroke-width': 1, 'stroke-linecap': 'round' }, eye);
  const lashesL = el('path', { id: 'lashes-lower', fill: 'none', stroke: '#2A1A08', 'stroke-width': .7, opacity: .55, 'stroke-linecap': 'round' }, eye);

  const lashU = Array.from({ length: 28 }, (_, i) => ({ t: .07 + i / 27 * .88, j: .8 + rnd() * .45, c: (rnd() - .5) * .3 }));
  const lashL = Array.from({ length: 13 }, (_, i) => ({ t: .14 + i / 12 * .74, j: .7 + rnd() * .6 }));

  const rippleLayer = el('g', { id: 'ripples' });

  // ---------- geometría de párpados ----------
  const lerp = (a, b, k) => a + (b - a) * k;
  const bez = (p0, p1, p2, p3, t) => {
    const u = 1 - t;
    return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
            u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]];
  };
  const bezD = (p0, p1, p2, p3, t) => {
    const u = 1 - t;
    return [3 * u * u * (p1[0] - p0[0]) + 6 * u * t * (p2[0] - p1[0]) + 3 * t * t * (p3[0] - p2[0]),
            3 * u * u * (p1[1] - p0[1]) + 6 * u * t * (p2[1] - p1[1]) + 3 * t * t * (p3[1] - p2[1])];
  };
  const f2 = n => n.toFixed(2);
  const cub = (a, b, c, d, dy) => `M${f2(a[0])} ${f2(a[1] + dy)} C${f2(b[0])} ${f2(b[1] + dy)} ${f2(c[0])} ${f2(c[1] + dy)} ${f2(d[0])} ${f2(d[1] + dy)}`;

  function setLids(f, gyR, widen, squint) {
    const ouOpen = (1 + .14 * widen) * (1 - .3 * squint);
    const olOpen = (1 + .04 * widen) * (1 - .4 * squint) * (.85 + .15 * f);
    const ld1 = 34 * olOpen, ld2 = 32 * olOpen;
    const P0 = [L0, L1], P3 = [R0, R1];
    const U1 = [L0 + 30, L1 + lerp(ld1 * .95, -44 * ouOpen + gyR * .5, f)];
    const U2 = [R0 - 48, R1 + lerp(ld2 * .95, -48 * ouOpen + gyR * .5, f)];
    const D1 = [R0 - 32, R1 + ld2 + gyR * .25];
    const D2 = [L0 + 42, L1 + ld1 + gyR * .25];

    apPath.setAttribute('d', `${cub(P0, U1, U2, P3, 0)} C${f2(D1[0])} ${f2(D1[1])} ${f2(D2[0])} ${f2(D2[1])} ${f2(L0)} ${f2(L1)} Z`);
    const up = cub(P0, U1, U2, P3, 0), lo = cub(P3, D1, D2, P0, 0);
    lidUThick.setAttribute('d', up); lashLineU.setAttribute('d', up); shU.setAttribute('d', up);
    lidURim.setAttribute('d', cub(P0, U1, U2, P3, -3.5));
    lidLThick.setAttribute('d', lo); lashLineL.setAttribute('d', lo); shL.setAttribute('d', lo);
    lidLRim.setAttribute('d', cub(P3, D1, D2, P0, 2.5));
    water.setAttribute('d', cub(P3, D1, D2, P0, -1.6));

    const cy1 = CY - 60 - 8 * f, cy2 = CY - 66 - 8 * f;
    const cr = `M${L0 - 10} ${L1 - 8} C${L0 + 26} ${f2(cy1)} ${R0 - 46} ${f2(cy2)} ${R0 + 10} ${R1 - 12}`;
    crease.setAttribute('d', cr); creaseSh.setAttribute('d', cr);
    creaseSh.setAttribute('transform', 'translate(0 2)');

    let d = '';
    for (const l of lashU) {
      const b = bez(P0, U1, U2, P3, l.t), tg = bezD(P0, U1, U2, P3, l.t);
      const tl = Math.hypot(tg[0], tg[1]) || 1, tx = tg[0] / tl, ty = tg[1] / tl;
      const nx = ty, ny = -tx;
      let dx = nx * f + tx * (l.t - .5) * 1.2, dy = ny * f + .8 * (1 - f) + ty * (l.t - .5) * 1.2;
      const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
      const len = (6 + 9 * Math.pow(Math.sin(Math.PI * l.t), .7)) * (.85 + .3 * l.t) * l.j;
      const cx = b[0] + (nx * f + dx * (1 - f)) * len * .6, cyy = b[1] + (ny * f + dy * (1 - f)) * len * .6 + l.c * len;
      d += `M${f2(b[0])} ${f2(b[1])} Q${f2(cx)} ${f2(cyy)} ${f2(b[0] + dx * len)} ${f2(b[1] + dy * len)}`;
    }
    lashesU.setAttribute('d', d);
    d = '';
    for (const l of lashL) {
      const b = bez(P3, D1, D2, P0, l.t), tg = bezD(P3, D1, D2, P0, l.t);
      const tl = Math.hypot(tg[0], tg[1]) || 1, nx = tg[1] / tl, ny = -tg[0] / tl;
      const len = (2.6 + 2.6 * Math.sin(Math.PI * l.t)) * l.j;
      d += `M${f2(b[0])} ${f2(b[1])} L${f2(b[0] + nx * len)} ${f2(b[1] + ny * len)}`;
    }
    lashesL.setAttribute('d', d);
  }

  // ---------- visitante (mouse / touch) ----------
  let ptr = null, lastPtr = -1e9;
  function onMove(x, y) { ptr = { x, y }; lastPtr = performance.now(); }
  addEventListener('pointermove', e => onMove(e.clientX, e.clientY), { passive: true });
  addEventListener('pointerdown', e => { onMove(e.clientX, e.clientY); queueBlink(performance.now()); ripple(); }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => { lastPtr = -1e9; });
  addEventListener('blur', () => { lastPtr = -1e9; });

  function ripple() {
    if (reduce) return;
    const c = el('circle', { cx: CX, cy: CY, r: 230, fill: 'none', class: 's-goldhi ripple', 'stroke-width': 2 }, rippleLayer);
    c.addEventListener('animationend', () => c.remove());
  }

  const pt = svg.createSVGPoint();
  function gazeFor(px, py) {
    const m = svg.getScreenCTM();
    if (!m) return { x: 0, y: 0, d: 999 };
    pt.x = CX; pt.y = CY;
    const c = pt.matrixTransform(m);
    const dx = px - c.x, dy = py - c.y, d = Math.hypot(dx, dy) || 1;
    const f = Math.min(d / (260 * m.a + 120), 1);
    return { x: dx / d * f, y: dy / d * f, d: d / m.a };
  }

  // ---------- cielo: estrellas, polvo dorado y estrellas fugaces ----------
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);
  const small = innerWidth < 600;
  const stars = Array.from({ length: small ? 55 : 120 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + .3, p: Math.random() * 6.28, s: .6 + Math.random() * 1.6 }));
  const newDust = init => ({ x: .5 + (Math.random() - .5) * .75, y: init ? Math.random() : 1.04, r: Math.random() * 1.7 + .4, vy: .00004 + Math.random() * .00009, ph: Math.random() * 6.28, a: .35 + Math.random() * .6 });
  const dust = Array.from({ length: small ? 26 : 55 }, () => newDust(true));
  let col = {};
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    col = { star: cs.getPropertyValue('--star-rgb').trim(), starA: parseFloat(cs.getPropertyValue('--star-a')) || 0, dust: cs.getPropertyValue('--dust-rgb').trim() };
  }
  readColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
  let shoot = null, nextShoot = performance.now() + 7000, skyT0 = performance.now();

  function drawSky(t, dt) {
    ctx.clearRect(0, 0, W, H);
    const intro = Math.min(Math.max((t - skyT0 - 1500) / 1500, 0), 1);
    if (col.starA > 0) {
      for (const s of stars) {
        const a = (.2 + .7 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p))) * col.starA * intro;
        ctx.fillStyle = `rgba(${col.star},${a.toFixed(3)})`;
        ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.283); ctx.fill();
      }
    }
    for (let i = 0; i < dust.length; i++) {
      const d = dust[i];
      d.y -= d.vy * dt; d.x += Math.sin(t / 1600 + d.ph) * .00004 * dt;
      if (d.y < -.03) { dust[i] = newDust(false); continue; }
      const fade = Math.min(1, d.y * 2.5) * Math.min(1, (1.04 - d.y) * 6) * d.a * intro;
      ctx.fillStyle = `rgba(${col.dust},${(fade * .18).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(d.x * W, d.y * H, d.r * 3.2, 0, 6.283); ctx.fill();
      ctx.fillStyle = `rgba(${col.dust},${fade.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(d.x * W, d.y * H, d.r, 0, 6.283); ctx.fill();
    }
    if (col.starA > 0) {
      if (!shoot && t > nextShoot) shoot = { x: W * (.05 + Math.random() * .5), y: H * (.04 + Math.random() * .25), vx: W * .9, vy: H * .28, life: 0 };
      if (shoot) {
        shoot.life += dt / 1000;
        const hx = shoot.x + shoot.vx * shoot.life, hy = shoot.y + shoot.vy * shoot.life;
        const tx2 = hx - shoot.vx * .14, ty2 = hy - shoot.vy * .14;
        const a = Math.sin(Math.min(shoot.life / .75, 1) * Math.PI);
        const g = ctx.createLinearGradient(hx, hy, tx2, ty2);
        g.addColorStop(0, `rgba(255,236,180,${a.toFixed(3)})`);
        g.addColorStop(1, 'rgba(255,236,180,0)');
        ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(tx2, ty2); ctx.stroke();
        if (shoot.life > .75) { shoot = null; nextShoot = t + 6000 + Math.random() * 7000; }
      }
    }
  }

  // ---------- comportamiento del ojo ----------
  const MX = 32, MY = 12;
  const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
  const t0 = performance.now();
  let introDone = reduce, last = t0;
  let gx = 0, gy = 0, fixX = 0, fixY = 0, micX = 0, micY = 0, nextMicro = 0, saccUntil = 0, refractory = 0;
  let widen = 0, squint = 0, nearT = 0, pr = 10.5, prBoost = 0, wasActive = false;
  let lookAway = null, nextLookAway = t0 + 11000;
  let blinkAt = -1, blinkDepth = 1, nextBlink = Infinity;
  const queue = [];
  function queueBlink(at) { if (introDone) queue.push(at); }

  function introOpen(t) {
    const e = t - t0;
    if (e < 2900) return 0;
    if (e < 3150) return ease((e - 2900) / 250) * 0.35;
    if (e < 3270) return 0.35 - ease((e - 3150) / 120) * 0.25;
    if (e < 3900) return 0.1 + ease((e - 3270) / 630) * 0.9;
    return 1;
  }
  function blinkFactor(t) {
    if (blinkAt < 0) return 1;
    const e = t - blinkAt, lo = 1 - blinkDepth;
    if (e < 70) return lerp(1, lo, e / 70);
    if (e < 110) return lo;
    if (e < 270) return lerp(lo, 1, ease((e - 110) / 160));
    blinkAt = -1;
    return 1;
  }
  function startBlink(t, depth) { if (blinkAt < 0) { blinkAt = t; blinkDepth = depth; } }
  function notice(t) {
    widen = 1; prBoost = 3;
    queueBlink(t + 380 + Math.random() * 200);
    if (Math.random() < .3) queueBlink(t + 720);
  }

  function frame(t) {
    const dt = Math.min(t - last, 50); last = t;
    const base = reduce ? 1 : introOpen(t);
    if (!introDone && t - t0 > 5400) { introDone = true; nextBlink = t + 2200 + Math.random() * 2500; }
    const active = ptr && t - lastPtr < 2600;
    let dX = 0, dY = 0, near = false;

    if (!introDone) {
      const e = t - t0;
      if (e < 4100) { dX = 0; dY = .15; }
      else if (e < 4700) { dX = -.95; dY = .1; }
      else if (e < 5300) { dX = .95; dY = .05; }
    } else {
      if (active) {
        const g = gazeFor(ptr.x, ptr.y);
        dX = g.x; dY = g.y; near = g.d < 120;
        if (!wasActive && !reduce) notice(t);
      }
      if (!reduce) {
        if (lookAway && t > lookAway.until) {
          lookAway = null; nextLookAway = t + 3500 + Math.random() * 5000;
          if (Math.random() < .35) queueBlink(t + 40);
        } else if (!lookAway && t > nextLookAway && !near) {
          const a = Math.random() * Math.PI * 2, m = .45 + Math.random() * .45;
          lookAway = { x: Math.cos(a) * m, y: Math.sin(a) * m * .7, until: t + 500 + Math.random() * 900 };
        }
        if (lookAway) { dX = lookAway.x; dY = lookAway.y; }
      }
    }
    wasActive = !!active;

    // sacadas rápidas para saltos grandes, seguimiento suave para movimientos cortos
    const amp = Math.hypot(dX - fixX, dY - fixY);
    if (amp > .16 && t > refractory) {
      fixX = dX; fixY = dY; saccUntil = t + 90; refractory = t + 140 + Math.random() * 80;
      if (introDone && !reduce && amp > .7 && Math.random() < .3) queueBlink(t + 20);
    } else if (amp <= .16) { fixX += (dX - fixX) * .1; fixY += (dY - fixY) * .1; }
    // microsacadas y temblor de fijación
    if (!reduce && t > nextMicro) {
      micX = (Math.random() - .5) * .06; micY = (Math.random() - .5) * .045;
      nextMicro = t + 300 + Math.random() * 700; saccUntil = Math.max(saccUntil, t + 40);
    }
    const trX = reduce ? 0 : Math.sin(t * .083) * .004 + Math.sin(t * .131) * .003;
    const trY = reduce ? 0 : Math.sin(t * .097) * .003 + Math.sin(t * .149) * .003;
    const k = t < saccUntil ? .5 : .2;
    gx += ((fixX + micX + trX) * MX - gx) * k;
    gy += ((fixY + micY + trY) * MY - gy) * k;

    // parpadeos: espontáneos, al notar al visitante y en cambios grandes de mirada
    if (introDone && !reduce && t > nextBlink) {
      queue.push(t);
      if (Math.random() < .15) queue.push(t + 330);
      nextBlink = t + 2200 + Math.random() * 3300;
    }
    if (queue.length && blinkAt < 0) {
      queue.sort((a, b) => a - b);
      if (t >= queue[0]) { queue.shift(); startBlink(t, Math.random() < .2 ? .65 : 1); }
    }
    const bf = blinkFactor(t);

    // entrecierra el ojo si te acercas demasiado; se abre de golpe al notarte
    nearT = near ? nearT + dt : 0;
    squint += ((nearT > 900 ? 1 : 0) - squint) * .04;
    widen *= Math.pow(.997, dt);

    // pupila: se contrae rápido con la luz y al acercarte, se dilata lento
    let tp = 10.5 + (near ? -2.6 : 0) + prBoost;
    prBoost *= Math.pow(.998, dt);
    if (!reduce) { const c = t - t0 - 6000; if (c > 0) { const m = c % 10000; if (m > 4200 && m < 4800) tp = 6; } }
    pr += (tp - pr) * (tp < pr ? .12 : .04);
    const hippus = reduce ? 0 : Math.sin(t / 900) * .25 + Math.sin(t / 2300) * .2;

    const gyR = gy - 8 * (1 - bf);
    setLids(base * bf, gyR, widen, squint);
    iris.setAttribute('transform', `translate(${f2(gx)} ${f2(gyR)})`);
    refl.setAttribute('transform', `translate(${f2(gx * .8)} ${f2(gyR * .8)})`);
    pupil.setAttribute('r', f2(pr + hippus));
    ruff.setAttribute('r', f2(pr + hippus + .6));

    // profundidad: las capas se separan siguiendo al visitante
    let nx = 0, ny = 0;
    if (!reduce) {
      if (active) { nx = ptr.x / innerWidth * 2 - 1; ny = ptr.y / innerHeight * 2 - 1; }
      else { nx = Math.sin(t / 4200) * .25; ny = Math.cos(t / 5100) * .2; }
    }
    px += (nx - px) * .06; py += (ny - py) * .06;
    raysPar.setAttribute('transform', `translate(${f2(-px * 12)} ${f2(-py * 9)})`);
    haloPar.setAttribute('transform', `translate(${f2(-px * 6)} ${f2(-py * 4)})`);
    capPar.setAttribute('transform', `translate(${f2(px * 5)} ${f2(py * 4)})`);

    if (!reduce) drawSky(t, dt);
    requestAnimationFrame(frame);
  }
  let px = 0, py = 0;
  setLids(reduce ? 1 : 0, 0, 0, 0);
  if (reduce) { skyT0 = -1e9; drawSky(performance.now(), 0); }
  requestAnimationFrame(frame);

  // ---------- negro / blanco ----------
  const btn = document.getElementById('theme');
  btn.addEventListener('click', () => {
    const root = document.documentElement;
    const toLight = root.dataset.theme !== 'light';
    root.dataset.theme = toLight ? 'light' : 'dark';
    btn.textContent = toLight ? 'Ver en negro' : 'Ver en blanco';
    readColors();
    if (reduce) drawSky(performance.now(), 0);
  });
})();
</script>
</body>
</html>
